function idEdge(a,b){ return document.getElementById('edge-'+a+'-'+b) || document.getElementById('edge-'+b+'-'+a); }

function highlightNode(nodeId){
  dimAll();
  const neigh = new Set([nodeId]);
  (adjacency[nodeId] || []).forEach(n => neigh.add(n));
  neigh.forEach(id => { const r = idRect(id); if(r) r.style.opacity = 1; const t = idText(id); if(t) t.style.opacity=1; });
  Object.keys(adjacency).forEach(a => adjacency[a].forEach(b => {
    if(neigh.has(a) && neigh.has(b)){
      const el = idEdge(a,b);
      if(el){ el.style.opacity = 0.98; el.style.stroke = '#333'; el.style.strokeWidth = 6; }
    }
  }));
}

    item.addEventListener('mouseout', () => { overlay.style.display='none'; resetAll(); });
  });

  // Dragging support

      pt.x = e.clientX; pt.y = e.clientY;
      const ctm = svg.getScreenCTM().inverse();
      const loc = pt.matrixTransform(ctm);
      offset.x = loc.x - parseFloat(selected.getAttribute('x'));
      offset.y = loc.y - parseFloat(selected.getAttribute('y'));
      e.preventDefault();
    }
  });

      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const ctm = svg.getScreenCTM().inverse(); const loc = pt.matrixTransform(ctm);
      const id = selected.id.replace('rect-','');
      const newX = loc.x - offset.x; const newY = loc.y - offset.y;
      selected.setAttribute('x', newX); selected.setAttribute('y', newY);
      const rectW = parseFloat(selected.getAttribute('width')); const rectH = parseFloat(selected.getAttribute('height'));
      const cx = newX + rectW/2; const cy = newY + rectH/2;
      const textEl = idText(id); if(textEl){ textEl.setAttribute('x', cx); textEl.setAttribute('y', cy+6); }
      // update connected edges and enforce min connector length 10px
      (adjacency[id] || []).forEach(nid => {
        const line = idEdge(id,nid);
        if(line){
          const rectA = idRect(id); const rectB = idRect(nid);

    document.querySelectorAll('.edge').forEach(line => {
      const classes = Array.from(line.classList).filter(c => c.startsWith('edge-'));
      if(classes.length>=2){
        const a = classes[0].replace('edge-',''); const b = classes[1].replace('edge-','');
        const ra = idRect(a); const rb = idRect(b);
        if(ra && rb){
          const ax = parseFloat(ra.getAttribute('x')) + parseFloat(ra.getAttribute('width'))/2;
          const ay = parseFloat(ra.getAttribute('y')) + parseFloat(ra.getAttribute('height'))/2;
          const bx = parseFloat(rb.getAttribute('x')) + parseFloat(rb.getAttribute('width'))/2;
          const by = parseFloat(rb.getAttribute('y')) + parseFloat(rb.getAttribute('height'))/2;
          const dx = bx-ax, dy = by-ay; const dist = Math.sqrt(dx*dx+dy*dy);
          line.setAttribute('x1', ax); line.setAttribute('y1', ay);
          line.setAttribute('x2', bx + (dist<10?12:0)); line.setAttribute('y2', by + (dist<10?12:0));
        }
      }
    });
  });

  // Save Layout -> download current HTML (positions are persisted in SVG attributes)
  document.getElementById('save-layout').addEventListener('click', () => {
    const blob = new Blob([document.documentElement.outerHTML], {type: 'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'COSS_Tags_Interactive_CustomLayout.html';
    a.click();
    URL.revokeObjectURL(url);
  });

  // Save as Image -> serialize SVG and draw to canvas
  document.getElementById('save-image').addEventListener('click', () => {
    const svgEl = document.getElementById('coss-svg');
    const svgData = new XMLSerializer().serializeToString(svgEl);
    const svgBlob = new Blob([svgData], {type:"image/svg+xml;charset=utf-8"});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 1920;
      canvas.height = 1080;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0);
      const a = document.createElement('a');
      a.download = 'COSS_Tags_Layout.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  // Ctrl+wheel zoom support on wrapper
  document.getElementById('svg-wrapper').addEventListener('wheel', e => { if(e.ctrlKey){ e.preventDefault(); scale = Math.min(3, Math.max(0.4, scale + (e.deltaY>0 ? -0.05 : 0.05))); applyScale(); } }, {passive:false});

}); // DOMContentLoaded end
</script>
</body></html>
