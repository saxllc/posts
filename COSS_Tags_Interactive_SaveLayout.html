<script>
// Data injected from server
const adjacency = {"Language": ["Learning-Loss"], "Connectivity": ["Healthcare-Access"], "Regulation": ["Skilling-Youth"], "Awareness": ["Agriculture-Productivity"], "Developers": ["Identity"], "Policy-makers": ["Payments"], "Educators": ["Learning"], "Funders": ["Health-Records"], "Learning-Loss": ["Language", "Government"], "Healthcare-Access": ["Connectivity", "Multilateral-Body"], "Skilling-Youth": ["Regulation", "Philanthropist"], "Agriculture-Productivity": ["Awareness", "Startup-Investor"], "Identity": ["Developers", "Recognition"], "Payments": ["Policy-makers", "Collaboration"], "Learning": ["Educators", "Reach"], "Health-Records": ["Funders", "Impact"], "Government": ["Learning-Loss", "Designing-for-Scale"], "Multilateral-Body": ["Healthcare-Access", "Coding-for-DPGs"], "Philanthropist": ["Skilling-Youth", "Building-Policy-Bridges"], "Startup-Investor": ["Agriculture-Productivity", "Impact-Measurement"], "Recognition": ["Identity", "Cost-Savings"], "Collaboration": ["Payments", "Inclusion"], "Impact": ["Health-Records", "Trust"], "Designing-for-Scale": ["Government"], "Coding-for-DPGs": ["Multilateral-Body"], "Building-Policy-Bridges": ["Philanthropist"], "Impact-Measurement": ["Startup-Investor"], "Reach": ["Learning"], "Cost-Savings": ["Recognition"], "Inclusion": ["Collaboration"], "Trust": ["Impact"]};
const initialPositions = {"Language": {"x": 711.1, "y": 940.0, "w": 140, "h": 40, "cx": 781.1, "cy": 960.0}, "Connectivity": {"x": 1687.8, "y": 333.9, "w": 158, "h": 40, "cx": 1766.8, "cy": 353.9}, "Regulation": {"x": 1141.5, "y": 109.5, "w": 140, "h": 40, "cx": 1211.5, "cy": 129.5}, "Awareness": {"x": 1182.8, "y": 789.6, "w": 140, "h": 40, "cx": 1252.8, "cy": 809.6}, "Developers": {"x": 317.3, "y": 425.3, "w": 140, "h": 40, "cx": 387.3, "cy": 445.3}, "Policy-makers": {"x": 66.7, "y": 693.2, "w": 167, "h": 40, "cx": 150.2, "cy": 713.2}, "Educators": {"x": 1584.2, "y": 611.2, "w": 140, "h": 40, "cx": 1654.2, "cy": 631.2}, "Funders": {"x": 660.7, "y": 102.4, "w": 140, "h": 40, "cx": 730.7, "cy": 122.4}, "Learning-Loss": {"x": 632.2, "y": 924.7, "w": 167, "h": 40, "cx": 715.7, "cy": 944.7}, "Healthcare-Access": {"x": 1661.6, "y": 363.2, "w": 203, "h": 40, "cx": 1763.1, "cy": 383.2}, "Skilling-Youth": {"x": 1183.9, "y": 100.0, "w": 176, "h": 40, "cx": 1271.9, "cy": 120.0}, "Agriculture-Productivity": {"x": 1154.6, "y": 816.3, "w": 266, "h": 40, "cx": 1287.6, "cy": 836.3}, "Identity": {"x": 238.6, "y": 407.7, "w": 140, "h": 40, "cx": 308.6, "cy": 427.7}, "Payments": {"x": 53.6, "y": 661.8, "w": 140, "h": 40, "cx": 123.6, "cy": 681.8}, "Learning": {"x": 1640.8, "y": 627.1, "w": 140, "h": 40, "cx": 1710.8, "cy": 647.1}, "Health-Records": {"x": 622.8, "y": 131.2, "w": 176, "h": 40, "cx": 710.8, "cy": 151.2}, "Government": {"x": 667.1, "y": 936.5, "w": 140, "h": 40, "cx": 737.1, "cy": 956.5}, "Multilateral-Body": {"x": 1698.5, "y": 389.7, "w": 203, "h": 40, "cx": 1800.0, "cy": 409.7}, "Philanthropist": {"x": 1232.9, "y": 121.6, "w": 176, "h": 40, "cx": 1320.9, "cy": 141.6}, "Startup-Investor": {"x": 1231.8, "y": 849.1, "w": 194, "h": 40, "cx": 1328.8, "cy": 869.1}, "Recognition": {"x": 159.2, "y": 390.9, "w": 149, "h": 40, "cx": 233.7, "cy": 410.9}, "Collaboration": {"x": 41.4, "y": 671.1, "w": 167, "h": 40, "cx": 124.9, "cy": 691.1}, "Impact": {"x": 593.3, "y": 153.0, "w": 140, "h": 40, "cx": 663.3, "cy": 173.0}, "Designing-for-Scale": {"x": 659.1, "y": 913.0, "w": 221, "h": 40, "cx": 769.6, "cy": 933.0}, "Coding-for-DPGs": {"x": 1685.5, "y": 418.2, "w": 185, "h": 40, "cx": 1778.0, "cy": 438.2}, "Building-Policy-Bridges": {"x": 1235.5, "y": 141.6, "w": 257, "h": 40, "cx": 1364.0, "cy": 161.6}, "Impact-Measurement": {"x": 1258.9, "y": 878.2, "w": 212, "h": 40, "cx": 1364.9, "cy": 898.2}, "Reach": {"x": 1678.6, "y": 645.5, "w": 140, "h": 40, "cx": 1748.6, "cy": 665.5}, "Cost-Savings": {"x": 92.1, "y": 376.9, "w": 158, "h": 40, "cx": 171.1, "cy": 396.9}, "Inclusion": {"x": 50.0, "y": 636.9, "w": 140, "h": 40, "cx": 120.0, "cy": 656.9}, "Trust": {"x": 533.3, "y": 155.3, "w": 140, "h": 40, "cx": 603.3, "cy": 175.3}};

// Utility helpers
function idRect(id){ return document.getElementById('rect-'+id); }
function idText(id){ return document.getElementById('text-'+id); }
function idEdge(a,b){ return document.getElementById('edge-'+a+'-'+b) || document.getElementById('edge-'+b+'-'+a); }

function dimAll(){ document.querySelectorAll('.node').forEach(n => n.style.opacity = 0.25); document.querySelectorAll('.edge').forEach(e => { e.style.opacity = 0.08; e.style.stroke = '#BBB'; e.style.strokeWidth = 3; }); }
function resetAll(){ document.querySelectorAll('.node').forEach(n => n.style.opacity = 1); document.querySelectorAll('.edge').forEach(e => { e.style.opacity = 0.9; e.style.stroke = '#999'; e.style.strokeWidth = 4; }); }

function highlightNode(nodeId){
  dimAll();
  const neigh = new Set([nodeId]);
  (adjacency[nodeId] || []).forEach(n => neigh.add(n));
  neigh.forEach(id => { const r = idRect(id); if(r) r.style.opacity = 1; const t = idText(id); if(t) t.style.opacity=1; });
  Object.keys(adjacency).forEach(a => adjacency[a].forEach(b => {
    if(neigh.has(a) && neigh.has(b)){
      const el = idEdge(a,b);
      if(el){ el.style.opacity = 0.98; el.style.stroke = '#333'; el.style.strokeWidth = 6; }
    }
  }));
}

// On load: attach interactions
document.addEventListener('DOMContentLoaded', () => {
  // node hover
  document.querySelectorAll('.node-group').forEach(g => {
    g.addEventListener('mouseover', () => highlightNode(g.getAttribute('data-node')));
    g.addEventListener('mouseout', () => resetAll());
  });

  // legend hover -> overlay + highlight cluster
  const overlay = document.getElementById('quiz-overlay');
  document.querySelectorAll('.legend-item').forEach(item => {
    item.addEventListener('mouseover', () => {
      overlay.innerText = item.getAttribute('data-question');
      overlay.style.display = 'block';
      const cluster = item.getAttribute('data-cluster');
      dimAll();
      document.querySelectorAll('.node-group').forEach(g => { if(g.getAttribute('data-cluster')===cluster){ const id=g.getAttribute('data-node'); const r=idRect(id); const t=idText(id); if(r) r.style.opacity=1; if(t) t.style.opacity=1; } });
    });
    item.addEventListener('mouseout', () => { overlay.style.display='none'; resetAll(); });
  });

  // Dragging support
  let selected = null, offset = {x:0,y:0};
  const svg = document.getElementById('coss-svg');
  svg.addEventListener('mousedown', e => {
    if(e.target.tagName === 'rect' && e.target.classList.contains('node')){
      selected = e.target;
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const ctm = svg.getScreenCTM().inverse();
      const loc = pt.matrixTransform(ctm);
      offset.x = loc.x - parseFloat(selected.getAttribute('x'));
      offset.y = loc.y - parseFloat(selected.getAttribute('y'));
      e.preventDefault();
    }
  });
  svg.addEventListener('mousemove', e => {
    if(selected){
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const ctm = svg.getScreenCTM().inverse(); const loc = pt.matrixTransform(ctm);
      const id = selected.id.replace('rect-','');
      const newX = loc.x - offset.x; const newY = loc.y - offset.y;
      selected.setAttribute('x', newX); selected.setAttribute('y', newY);
      const rectW = parseFloat(selected.getAttribute('width')); const rectH = parseFloat(selected.getAttribute('height'));
      const cx = newX + rectW/2; const cy = newY + rectH/2;
      const textEl = idText(id); if(textEl){ textEl.setAttribute('x', cx); textEl.setAttribute('y', cy+6); }
      // update connected edges and enforce min connector length 10px
      (adjacency[id] || []).forEach(nid => {
        const line = idEdge(id,nid);
        if(line){
          const rectA = idRect(id); const rectB = idRect(nid);
          const ax = parseFloat(rectA.getAttribute('x')) + parseFloat(rectA.getAttribute('width'))/2;
          const ay = parseFloat(rectA.getAttribute('y')) + parseFloat(rectA.getAttribute('height'))/2;
          const bx = parseFloat(rectB.getAttribute('x')) + parseFloat(rectB.getAttribute('width'))/2;
          const by = parseFloat(rectB.getAttribute('y')) + parseFloat(rectB.getAttribute('height'))/2;
          let dx = bx-ax, dy = by-ay;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if(dist < 10){ dx += 12; dy += 12; } // nudge to maintain visible connector
          line.setAttribute('x1', ax); line.setAttribute('y1', ay);
          line.setAttribute('x2', bx + (dist<10?12:0)); line.setAttribute('y2', by + (dist<10?12:0));
        }
      });
    }
  });
  svg.addEventListener('mouseup', e => { selected = null; });
  svg.addEventListener('mouseleave', e => { selected = null; });

  // Touch support (basic)
  svg.addEventListener('touchstart', e => {
    const t = e.touches[0];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if(el && el.tagName==='rect' && el.classList.contains('node')){
      selected = el;
      const pt = svg.createSVGPoint(); pt.x = t.clientX; pt.y = t.clientY;
      const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
      offset.x = loc.x - parseFloat(selected.getAttribute('x'));
      offset.y = loc.y - parseFloat(selected.getAttribute('y'));
      e.preventDefault();
    }
  }, {passive:false});
  svg.addEventListener('touchmove', e => {
    if(selected){
      const t = e.touches[0];
      const pt = svg.createSVGPoint(); pt.x = t.clientX; pt.y = t.clientY;
      const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
      const id = selected.id.replace('rect-','');
      const newX = loc.x - offset.x; const newY = loc.y - offset.y;
      selected.setAttribute('x', newX); selected.setAttribute('y', newY);
      const rectW = parseFloat(selected.getAttribute('width')); const rectH = parseFloat(selected.getAttribute('height'));
      const cx = newX + rectW/2; const cy = newY + rectH/2;
      const textEl = idText(id); if(textEl){ textEl.setAttribute('x', cx); textEl.setAttribute('y', cy+6); }
      (adjacency[id] || []).forEach(nid => {
        const line = idEdge(id,nid);
        if(line){
          const rectA = idRect(id); const rectB = idRect(nid);
          const ax = parseFloat(rectA.getAttribute('x')) + parseFloat(rectA.getAttribute('width'))/2;
          const ay = parseFloat(rectA.getAttribute('y')) + parseFloat(rectA.getAttribute('height'))/2;
          const bx = parseFloat(rectB.getAttribute('x')) + parseFloat(rectB.getAttribute('width'))/2;
          const by = parseFloat(rectB.getAttribute('y')) + parseFloat(rectB.getAttribute('height'))/2;
          const dx = bx-ax, dy = by-ay; const dist = Math.sqrt(dx*dx+dy*dy);
          line.setAttribute('x1', ax); line.setAttribute('y1', ay);
          line.setAttribute('x2', bx + (dist<10?12:0)); line.setAttribute('y2', by + (dist<10?12:0));
        }
      });
      e.preventDefault();
    }
  }, {passive:false});

  // Zoom controls (scale container)
  let scale = 1.0;
  const container = document.getElementById('svg-container');
  function applyScale(){ container.style.transform = 'scale(' + scale + ')'; }
  document.getElementById('zoom-in').addEventListener('click', () => { scale = Math.min(3, scale + 0.1); applyScale(); });
  document.getElementById('zoom-out').addEventListener('click', () => { scale = Math.max(0.4, scale - 0.1); applyScale(); });
  document.getElementById('zoom-reset').addEventListener('click', () => { scale = 1.0; applyScale(); });

  // Reset layout -> restore initialPositions
  document.getElementById('reset-layout').addEventListener('click', () => {
    Object.keys(initialPositions).forEach(id => {
      const pos = initialPositions[id];
      const rect = idRect(id); const txt = idText(id);
      if(rect){ rect.setAttribute('x', pos.x); rect.setAttribute('y', pos.y); }
      if(txt){ txt.setAttribute('x', pos.cx); txt.setAttribute('y', pos.cy + 6); }
    });
    // update edges to match
    document.querySelectorAll('.edge').forEach(line => {
      const classes = Array.from(line.classList).filter(c => c.startsWith('edge-'));
      if(classes.length>=2){
        const a = classes[0].replace('edge-',''); const b = classes[1].replace('edge-','');
        const ra = idRect(a); const rb = idRect(b);
        if(ra && rb){
          const ax = parseFloat(ra.getAttribute('x')) + parseFloat(ra.getAttribute('width'))/2;
          const ay = parseFloat(ra.getAttribute('y')) + parseFloat(ra.getAttribute('height'))/2;
          const bx = parseFloat(rb.getAttribute('x')) + parseFloat(rb.getAttribute('width'))/2;
          const by = parseFloat(rb.getAttribute('y')) + parseFloat(rb.getAttribute('height'))/2;
          const dx = bx-ax, dy = by-ay; const dist = Math.sqrt(dx*dx+dy*dy);
          line.setAttribute('x1', ax); line.setAttribute('y1', ay);
          line.setAttribute('x2', bx + (dist<10?12:0)); line.setAttribute('y2', by + (dist<10?12:0));
        }
      }
    });
  });

  // Save Layout -> download current HTML (positions are persisted in SVG attributes)
  document.getElementById('save-layout').addEventListener('click', () => {
    const blob = new Blob([document.documentElement.outerHTML], {type: 'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'COSS_Tags_Interactive_CustomLayout.html';
    a.click();
    URL.revokeObjectURL(url);
  });

  // Save as Image -> serialize SVG and draw to canvas
  document.getElementById('save-image').addEventListener('click', () => {
    const svgEl = document.getElementById('coss-svg');
    const svgData = new XMLSerializer().serializeToString(svgEl);
    const svgBlob = new Blob([svgData], {type:"image/svg+xml;charset=utf-8"});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 1920;
      canvas.height = 1080;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0);
      const a = document.createElement('a');
      a.download = 'COSS_Tags_Layout.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  // Ctrl+wheel zoom support on wrapper
  document.getElementById('svg-wrapper').addEventListener('wheel', e => { if(e.ctrlKey){ e.preventDefault(); scale = Math.min(3, Math.max(0.4, scale + (e.deltaY>0 ? -0.05 : 0.05))); applyScale(); } }, {passive:false});

}); // DOMContentLoaded end
</script>
