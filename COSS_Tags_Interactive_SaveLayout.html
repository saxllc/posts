<script>
function sanitize(s){ return s.replace(/[^a-zA-Z0-9]/g, "-"); }
const adjacency = {"Language": ["Learning-Loss"], "Connectivity": ["Healthcare-Access"], "Regulation": ["Skilling-Youth"], "Awareness": ["Agriculture-Productivity"], "Developers": ["Identity"], "Policy-makers": ["Payments"], "Educators": ["Learning"], "Funders": ["Health-Records"], "Learning-Loss": ["Language", "Government"], "Healthcare-Access": ["Connectivity", "Multilateral-Body"], "Skilling-Youth": ["Regulation", "Philanthropist"], "Agriculture-Productivity": ["Awareness", "Startup-Investor"], "Identity": ["Developers", "Recognition"], "Payments": ["Policy-makers", "Collaboration"], "Learning": ["Educators", "Reach"], "Health-Records": ["Funders", "Impact"], "Government": ["Learning-Loss", "Designing-for-Scale"], "Multilateral-Body": ["Healthcare-Access", "Coding-for-DPGs"], "Philanthropist": ["Skilling-Youth", "Building-Policy-Bridges"], "Startup-Investor": ["Agriculture-Productivity", "Impact-Measurement"], "Recognition": ["Identity", "Cost-Savings"], "Collaboration": ["Payments", "Inclusion"], "Impact": ["Health-Records", "Trust"], "Designing-for-Scale": ["Government"], "Coding-for-DPGs": ["Multilateral-Body"], "Building-Policy-Bridges": ["Philanthropist"], "Impact-Measurement": ["Startup-Investor"], "Reach": ["Learning"], "Cost-Savings": ["Recognition"], "Inclusion": ["Collaboration"], "Trust": ["Impact"]};

function dimAll(){
    document.querySelectorAll('.node').forEach(n => n.style.opacity = 0.25);
    document.querySelectorAll('.edge').forEach(e => { e.style.opacity = 0.08; e.style.stroke = '#BBB'; e.style.strokeWidth = 2; });
}
function resetAll(){
    document.querySelectorAll('.node').forEach(n => n.style.opacity = 1);
    document.querySelectorAll('.edge').forEach(e => { e.style.opacity = 0.8; e.style.stroke = '#BBB'; e.style.strokeWidth = 2; });
}
function highlightNode(nodeId){
    dimAll();
    const neigh = new Set([nodeId]);
    (adjacency[nodeId] || []).forEach(n => neigh.add(n));
    neigh.forEach(id => { const r = document.getElementById('rect-'+id); if(r) r.style.opacity = 1; const t = document.getElementById('text-'+id); if(t) t.style.opacity=1; });
    Object.keys(adjacency).forEach(a => adjacency[a].forEach(b => { 
        if(neigh.has(a) && neigh.has(b)){ 
            document.querySelectorAll('.edge.edge-'+a+'.edge-'+b).forEach(el => { el.style.opacity=0.95; el.style.stroke='#333'; el.style.strokeWidth=3; });
            document.querySelectorAll('.edge.edge-'+b+'.edge-'+a).forEach(el => { el.style.opacity=0.95; el.style.stroke='#333'; el.style.strokeWidth=3; });
        }
    }));
}

document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.node-group').forEach(g => {
        g.addEventListener('mouseover', () => highlightNode(g.getAttribute('data-node')));
        g.addEventListener('mouseout', () => resetAll());
        // click does nothing now (no alerts)
    });
    document.querySelectorAll('.legend-item').forEach(item => {
        item.addEventListener('mouseover', () => {
            const cluster = item.getAttribute('data-cluster');
            dimAll();
            document.querySelectorAll('.node-group').forEach(g => { if(g.getAttribute('data-cluster')===cluster){ const id=g.getAttribute('data-node'); document.getElementById('rect-'+id).style.opacity=1; document.getElementById('text-'+id).style.opacity=1; } });
        });
        item.addEventListener('mouseout', () => resetAll());
    });
    // Dragging
    let selected = null, offset = {x:0,y:0};
    const svg = document.getElementById('coss-svg');
    svg.addEventListener('mousedown', e => {
        if(e.target.tagName === 'rect' && e.target.classList.contains('node')){
            selected = e.target;
            const pt = svg.createSVGPoint();
            pt.x = e.clientX; pt.y = e.clientY;
            const ctm = svg.getScreenCTM().inverse();
            const loc = pt.matrixTransform(ctm);
            offset.x = loc.x - parseFloat(selected.getAttribute('x'));
            offset.y = loc.y - parseFloat(selected.getAttribute('y'));
            e.preventDefault();
        }
    });
    svg.addEventListener('mousemove', e => {
        if(selected){
            const pt = svg.createSVGPoint();
            pt.x = e.clientX; pt.y = e.clientY;
            const ctm = svg.getScreenCTM().inverse();
            const loc = pt.matrixTransform(ctm);
            const id = selected.id.replace('rect-','');
            const newX = loc.x - offset.x;
            const newY = loc.y - offset.y;
            selected.setAttribute('x', newX);
            selected.setAttribute('y', newY);
            const rectW = parseFloat(selected.getAttribute('width'));
            const rectH = parseFloat(selected.getAttribute('height'));
            const cx = newX + rectW/2;
            const cy = newY + rectH/2;
            const textEl = document.getElementById('text-'+id);
            textEl.setAttribute('x', cx);
            textEl.setAttribute('y', cy+6);
            (adjacency[id] || []).forEach(nid => {
                const line = document.querySelector('#edge-'+id+'-'+nid) || document.querySelector('#edge-'+nid+'-'+id);
                if(line){
                    const rectA = document.getElementById('rect-'+id);
                    const rectB = document.getElementById('rect-'+nid);
                    const ax = parseFloat(rectA.getAttribute('x')) + parseFloat(rectA.getAttribute('width'))/2;
                    const ay = parseFloat(rectA.getAttribute('y')) + parseFloat(rectA.getAttribute('height'))/2;
                    const bx = parseFloat(rectB.getAttribute('x')) + parseFloat(rectB.getAttribute('width'))/2;
                    const by = parseFloat(rectB.getAttribute('y')) + parseFloat(rectB.getAttribute('height'))/2;
                    line.setAttribute('x1', ax); line.setAttribute('y1', ay);
                    line.setAttribute('x2', bx); line.setAttribute('y2', by);
                }
            });
        }
    });
    svg.addEventListener('mouseup', e => { selected = null; });
    svg.addEventListener('mouseleave', e => { selected = null; });
    // Zoom controls
    let scale = 1.0;
    const container = document.getElementById('svg-container');
    function applyScale(){ container.style.transform = 'scale(' + scale + ')'; }
    document.getElementById('zoom-in').addEventListener('click', () => { scale = Math.min(3, scale + 0.1); applyScale(); });
    document.getElementById('zoom-out').addEventListener('click', () => { scale = Math.max(0.4, scale - 0.1); applyScale(); });
    document.getElementById('zoom-reset').addEventListener('click', () => { scale = 1.0; applyScale(); });
    document.getElementById('svg-wrapper').addEventListener('wheel', e => { if(e.ctrlKey){ e.preventDefault(); scale = Math.min(3, Math.max(0.4, scale + (e.deltaY>0 ? -0.05 : 0.05))); applyScale(); } }, {passive:false});

    // Save Layout
    document.getElementById('save-layout').addEventListener('click', () => {
        const positions = {};
        document.querySelectorAll('.node-group').forEach(g => {
            const id = g.getAttribute('data-node');
            const rect = document.getElementById('rect-'+id);
            const x = parseFloat(rect.getAttribute('x'));
            const y = parseFloat(rect.getAttribute('y'));
            const w = parseFloat(rect.getAttribute('width'));
            const h = parseFloat(rect.getAttribute('height'));
            const cx = x + w/2;
            const cy = y + h/2;
            positions[id] = {x: x, y: y, cx: cx, cy: cy};
        });
        const blob = new Blob([document.documentElement.outerHTML], {type: 'text/html'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'COSS_Tags_Interactive_CustomLayout.html';
        a.click();
        URL.revokeObjectURL(url);
    });
});
</script>
